<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Quincena · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--a:#C8102E;--b:#E5252A;--on:#FFFFFF;--grad:linear-gradient(135deg,var(--a),var(--b));
  --bg:radial-gradient(900px 600px at 0% 0%,rgba(200,16,46,.28),transparent 60%),radial-gradient(800px 600px at 100% 30%,rgba(229,37,42,.2),transparent 60%),#F4F2F2;
  --card:rgba(255,255,255,.62);--border:rgba(255,255,255,.85);--inset:rgba(255,255,255,.55);--text:#1B1A17;--muted:#5A564E;--line:rgba(27,26,23,.09);--lineS:rgba(27,26,23,.25);
  --shadow:0 10px 30px rgba(60,45,10,.08);--ok:#15803D;--okS:rgba(21,128,61,.12);--bad:#B91C1C;--badS:rgba(185,28,28,.10);--warn:#8A5A00;--warnS:rgba(202,138,4,.15);
  --ink:#A50E24;--soft:rgba(200,16,46,.18);--lvBox:rgba(200,16,46,.08);color-scheme:light}
:root[data-theme="dark"]{--bg:radial-gradient(900px 600px at 0% 0%,rgba(200,16,46,.22),transparent 60%),radial-gradient(800px 600px at 100% 30%,rgba(229,37,42,.16),transparent 60%),#08080A;
  --card:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);--inset:rgba(255,255,255,.05);--text:#F3F1EC;--muted:#ABA69D;--line:rgba(255,255,255,.10);--lineS:rgba(255,255,255,.28);
  --shadow:0 10px 30px rgba(0,0,0,.35);--ok:#4ADE80;--okS:rgba(74,222,128,.15);--bad:#FB8A8A;--badS:rgba(248,113,113,.16);--warn:#FACC15;--warnS:rgba(250,204,21,.15);
  --ink:#FF8A8A;--soft:rgba(200,16,46,.2);--lvBox:rgba(200,16,46,.1);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);background-attachment:fixed;transition:background .4s ease,color .4s ease}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.page{padding:20px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.glass{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 18px;border-radius:22px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 240px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:0 0 44px}
.brand b{font-weight:800;font-size:18px;letter-spacing:.02em;display:block}
.muted{font-size:13px;color:var(--muted)}.mutedB{font-size:13px;font-weight:700;color:var(--muted)}.mutedSm{font-size:12px;color:var(--muted)}
.search{position:relative;flex:1 1 280px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:14px;background:var(--inset);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;outline:none}
.searchBig{position:relative;display:flex;align-items:center;gap:12px;padding:0 16px;height:54px;border-radius:16px;background:var(--inset);border:1.5px solid rgba(200,16,46,.45)}
.searchBig input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;outline:none}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.iconBtn{width:44px;height:44px;flex:0 0 44px;border-radius:14px;border:1px solid var(--line);background:var(--inset);display:flex;align-items:center;justify-content:center}
.pill{height:44px;display:flex;align-items:center;padding:0 14px;border-radius:14px;font-size:14px;font-weight:700;background:var(--soft);color:var(--ink)}
.layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
nav.side{flex:1 1 220px;max-width:250px;display:flex;flex-direction:column;gap:16px;padding:16px 12px;border-radius:22px;position:sticky;top:20px}
.group{display:flex;flex-direction:column;gap:4px}
.navGroup{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);padding:0 10px 4px}
.navBtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;width:100%;padding:0 12px;border-radius:12px;border:0;font-size:14px;text-align:left;font-weight:600;background:transparent}
.navBtn.on{font-weight:800;background:var(--soft);color:var(--ink)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;background:var(--a);color:var(--on)}
main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:20px}
.card{flex:1 1 340px;min-width:0;padding:20px;border-radius:22px;display:flex;flex-direction:column;gap:14px}
.card.grow{flex:1.4 1 380px;gap:12px}
main>.card{flex:none}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{padding:18px;border-radius:20px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:30px;font-weight:800}
h1{margin:0;font-size:24px;font-weight:800}h1.big{font-size:28px}h2{margin:0;font-size:18px;font-weight:800}h3{margin:4px 0 0;font-size:15px;font-weight:800}
.inset{padding:14px;border-radius:16px;background:var(--inset);border:1px solid var(--line)}
.rowWrap{padding:14px;border-radius:16px;background:var(--inset);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.taskRow,.autoRow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--inset);border:1px solid var(--line);width:100%;text-align:left}
.autoRow{padding:12px 14px}
.num{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.tone-l{background:var(--soft);color:var(--ink)}.tone-w{background:var(--warnS);color:var(--warn)}.tone-d{background:var(--badS);color:var(--bad)}.tone-o{background:var(--okS);color:var(--ok)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.lv{background:var(--soft);color:var(--ink)}.chip.ok{background:var(--okS);color:var(--ok)}.chip.warn{background:var(--warnS);color:var(--warn)}.chip.bad{background:var(--badS);color:var(--bad)}.chip.mute{background:var(--inset);color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:14px;font-size:14px;font-weight:700;border:0;background:var(--grad);color:var(--on)}
.btn.s{border:1px solid var(--line);background:var(--inset);color:var(--text);font-weight:600}
.btn.d{border:1px solid var(--badS);background:transparent;color:var(--bad);font-weight:600}
.btn.sm{min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--text);font-size:13px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnCol{display:flex;flex-direction:column;gap:6px;flex:0 0 150px}
.check{width:20px;height:20px;flex:0 0 20px;margin:0;accent-color:var(--a)}
.lvBox{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid rgba(200,16,46,.35);background:var(--lvBox)}
.photo{min-height:150px;border-radius:16px;border:1px dashed var(--lineS);background:var(--inset);color:var(--muted);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;gap:6px;overflow:hidden}
.photo img{width:100%;max-height:220px;object-fit:contain;border-radius:10px;cursor:zoom-in}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.input,select.input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--text);font-size:14px;font-weight:600;padding:0 12px;width:100%}
.inputSm{width:110px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--inset);font-size:14px;padding:0 10px}
textarea.input{height:auto;padding:12px;resize:vertical;font-weight:500}
select.input option{color:#1B1A17}
.empty{padding:22px;border-radius:16px;border:1px dashed var(--lineS);text-align:center;font-size:14px;color:var(--muted)}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--grad);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.avatar.big{width:64px;height:64px;flex:0 0 64px;border-radius:20px;font-size:22px}
.userRow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;width:100%;background:var(--inset);border:1px solid var(--line);text-align:left}
.userRow.on{background:var(--soft);border-color:rgba(200,16,46,.5)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}.kv b{font-weight:600;text-align:right}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:5px;margin-top:5px;flex:0 0 10px}
.switch{position:relative;width:48px;height:28px;flex:0 0 48px;border-radius:14px;background:var(--lineS);transition:background .25s ease}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .25s ease}
[aria-pressed="true"] .switch{background:var(--a)}[aria-pressed="true"] .switch i{left:23px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.day{position:relative;display:flex;align-items:center;justify-content:center;height:40px;border-radius:12px;font-size:13px;font-weight:600;background:var(--inset)}
.day.due{background:var(--grad);color:var(--on);font-weight:800}.day.today{border:1.5px solid rgba(200,16,46,.5);color:var(--ink);font-weight:800}.day.blank{background:transparent}
.dueCount{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--bg);background-color:var(--text)}
:root[data-theme="dark"] .dueCount{color:#1B1A17}:root:not([data-theme="dark"]) .dueCount{color:#fff}
.bars{display:flex;align-items:flex-end;gap:18px;height:170px;border-bottom:1px solid var(--line)}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar2{display:flex;gap:4px;align-items:flex-end}.bar2 span{display:block;width:20px;border-radius:6px 6px 2px 2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tableWrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
th{padding:12px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:left}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
.fees{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fees input{width:90px;height:44px;font-size:24px;font-weight:800;border-radius:12px;border:1px solid var(--line);background:var(--inset);padding:0 10px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.login{max-width:440px;margin:8vh auto 0;padding:28px;border-radius:22px;display:flex;flex-direction:column;gap:16px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.modal img{max-width:min(96vw,1000px);max-height:90vh;border-radius:16px;background:#fff}
.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(92vw,520px);padding:14px 18px;border-radius:16px;font-size:14px;font-weight:700;background:var(--text);color:var(--bg);background-color:var(--text);box-shadow:0 12px 30px rgba(0,0,0,.3)}
:root[data-theme="dark"] .toast{color:#1B1A17}:root:not([data-theme="dark"]) .toast{color:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
@media (max-width:760px){.page{padding:12px;gap:14px}nav.side{max-width:none;position:static;flex-direction:row;overflow-x:auto;gap:8px;padding:10px}nav.side .group{flex-direction:row;gap:6px;flex:0 0 auto}nav.side .navGroup{display:none}.navBtn{white-space:nowrap;width:auto}.btnCol{flex:1 1 100%}.grid2{grid-template-columns:1fr}}
@media print{nav.side,.bar,.noprint{display:none!important}body{background:#fff;color:#000}.glass{box-shadow:none;border:1px solid #ddd;background:#fff}}
</style>
</head>
<body>
<div id="loginView" class="page">
  <form id="loginForm" class="login glass" autocomplete="on">
    <div class="brand" style="flex:none"><div class="logo" aria-hidden="true">15</div><div><b>QUINCENA</b><span class="muted">Panel del prestamista</span></div></div>
    <div id="configWarn" class="inset hidden" style="font-size:14px"></div>
    <label class="field">Correo<input id="email" class="input" type="email" autocomplete="username" required placeholder="tu-correo@ejemplo.com"></label>
    <label class="field">Contraseña<input id="password" class="input" type="password" autocomplete="current-password" required minlength="6"></label>
    <div id="loginErr" class="err" role="alert"></div>
    <button class="btn" type="submit">Iniciar sesión</button>
    <span class="muted">Entran el administrador y los cobradores con el correo y la contraseña de su cuenta en Supabase.</span>
  </form>
</div>
<div id="appView" class="page hidden">
  <header class="bar glass">
    <div class="brand"><div class="logo" aria-hidden="true">15</div><div><b>QUINCENA</b><span class="muted">Panel del prestamista</span></div></div>
    <label class="search"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="sr">Buscar cliente por cédula o nombre</span><input id="topSearch" type="search" placeholder="Buscar cliente por cédula o nombre…" autocomplete="off"></label>
    <div class="tools">
      <button class="iconBtn" type="button" data-act="refresh" aria-label="Actualizar datos" title="Actualizar"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="iconBtn" type="button" data-act="theme" aria-label="Cambiar modo claro u oscuro" id="themeBtn"></button>
      <span class="pill" id="rolePill">Administrador</span>
      <button class="iconBtn" type="button" data-act="logout" aria-label="Cerrar sesión" title="Cerrar sesión"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
    </div>
  </header>
  <div class="layout">
    <nav class="side glass" id="nav" aria-label="Secciones del panel"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Imagen ampliada"><img id="modalImg" alt="Imagen ampliada"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="vendor/supabase.js"></script>
<script src="/api/config"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ============ conexión ============ */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG=window.QUINCENA_CONFIG||{},BUCKET='documentos';
let sb=null;
try{if(CFG.url&&CFG.anonKey&&window.supabase)sb=supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'quincena.admin.auth'}})}catch(_){sb=null}
function errText(e,fb){const m=String(e?.message||e?.error_description||'');if(/Invalid login credentials/i.test(m))return 'Correo o contraseña incorrectos.';if(/Email not confirmed/i.test(m))return 'Esta cuenta no está confirmada. Confírmala en Supabase → Authentication → Users.';if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'No se pudo conectar con Supabase. Revisa tu internet.';if(/JWT/i.test(m)){logout(false);return 'La sesión expiró. Inicia sesión de nuevo.'}return m||fb||'No se pudo completar la acción.'}
async function q(p,fb){const {data,error}=await p;if(error)throw new Error(errText(error,fb));return data}
let toastT=null;function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.add('hidden'),3800)}

/* ============ utilidades ============ */
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const parse=s=>{const a=String(s).slice(0,10).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return isoOf(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const money=n=>'$'+r2(Number(n)||0).toLocaleString('es-VE',{minimumFractionDigits:r2(n)%1?2:0,maximumFractionDigits:2});
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fmtD=s=>{if(!s)return '—';const d=parse(s);return d.getDate()+' '+MES[d.getMonth()]};
const fmtLong=s=>{const d=parse(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESL[d.getMonth()].toLowerCase()};
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'');
const initials=n=>String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'Q';
const ICON={sun:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',moon:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>',chev:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',close:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',search:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'};

/* ============ reglas del negocio (iguales a la app del cliente) ============ */
const LV_NAMES=['Ámbar','Jade','Zafiro','Rubí'],LV_MIN=[0,121,241,500];
const DEF_SETTINGS={rates:{1:30,2:35,3:40},levels:[{limit:50,maxN:2},{limit:70,maxN:2},{limit:90,maxN:3},{limit:110,maxN:3}],mora:4,pipoMax:3,capital:0,payDetail:'',autoReminder:true,autoMora:true};
let SET=JSON.parse(JSON.stringify(DEF_SETTINGS));
const lvIdx=u=>{const o=Number(u?.levelOverride);if(o>=1&&o<=4)return o-1;let k=0;LV_MIN.forEach((m,i)=>{if((Number(u?.points)||0)>=m)k=i});return k};
const lvName=u=>'Nivel '+(lvIdx(u)+1);

/* Resumen de un expediente (todo se calcula a partir del estado real del cliente). */
function shape(row){
  const s=row.state||{},u=s.user||{},loans=Array.isArray(s.loans)?s.loans:[];
  const insts=[];loans.forEach(l=>(l.installments||[]).forEach(i=>insts.push({l,i})));
  const paid=insts.filter(x=>x.i.status==='paid'),onTime=paid.filter(x=>!x.i.paidOn||!x.i.due||(x.i.submittedOn||x.i.paidOn)<=x.i.due);
  const overdue=insts.filter(x=>x.l.status==='activo'&&isOverdue(x.i));
  const cr=credit(u);
  const state=u.accountBlocked?'Bloqueado':overdue.length?'En mora':cr.status==='pending'?'En verificación':cr.status==='docs'?'Fotos solicitadas':cr.status==='rejected'?'Línea rechazada':loans.some(l=>l.status==='solicitud')?'Solicitud pendiente':'Al día';
  return {id:row.id,row,s,u,loans,name:row.name||u.fullName||u.name||'Sin nombre',ci:row.ci||u.profile?.ci||'',created:row.created_at,updated:row.updated_at,version:row.version,
    level:lvName(u),lvIdx:lvIdx(u),cr,state,overdue,paidCount:paid.length,onTimePct:paid.length?Math.round(onTime.length/paid.length*100):null,
    requests:loans.filter(l=>l.status==='solicitud'),active:loans.filter(l=>l.status==='activo'),phone:phoneOf(u)};
}

/* Cambia el expediente de un cliente con control de versión (si el cliente lo cambió a la vez, se reintenta). */
async function mutate(id,fn,okMsg){
  for(let attempt=0;attempt<2;attempt++){
    const row=await q(sb.from('clients').select('id,version,state').eq('id',id).single(),'No se pudo abrir el expediente.');
    const s=row.state;s.notes=Array.isArray(s.notes)?s.notes:[];s.log=Array.isArray(s.log)?s.log:[];s.seq=Number(s.seq)||1;s.user=s.user||{};
    const res=await fn(s,row);if(res===false)return false;
    const upd=await q(sb.from('clients').update({state:s}).eq('id',id).eq('version',row.version).select('version'),'No se pudieron guardar los cambios.');
    if(upd.length){if(okMsg)toast(okMsg);return true}
  }
  toast('El cliente actualizó su expediente al mismo tiempo. Inténtalo de nuevo.');return false;
}

/* ============ cálculos del panel ============ */
function allPending(){const a=[];clients.forEach(c=>c.active.forEach(l=>(l.installments||[]).forEach(i=>{if(i.status!=='paid')a.push({c,l,i})})));return a}
function nextDueDate(){const d=allPending().filter(x=>x.i.due>=today()).map(x=>x.i.due).sort()[0];return d||null}
function paymentsToValidate(){
  const out=[];
  clients.forEach(c=>c.active.forEach(l=>{
    const ins=l.installments||[];
    const bundle=ins.filter(i=>i.status==='validating'&&i.bundle);
    if(bundle.length){const exp=r2(bundle.reduce((a,i)=>a+owed(i),0)),got=r2(bundle.reduce((a,i)=>a+(Number(i.paymentAmount)||owed(i)),0));out.push({key:c.id+'|'+l.id+'|b',c,l,kind:'bundle',label:'Todas las cuotas ('+bundle.length+')',ref:bundle[0].ref,when:bundle[0].submittedOn,amount:got,match:Math.abs(exp-got)<0.011,proof:bundle[0].proofData,n:bundle[0].n})}
    ins.forEach(i=>{
      if(i.status==='validating'&&!i.bundle){const got=Number(i.paymentAmount)||owed(i);out.push({key:c.id+'|'+l.id+'|'+i.n,c,l,kind:'cuota',label:'Cuota '+i.n+' de '+l.n,ref:i.ref,when:i.submittedOn,amount:got,match:Math.abs(owed(i)-got)<0.011,proof:i.proofData,n:i.n})}
      (i.abonos||[]).forEach(a=>{if(a.status==='validating')out.push({key:c.id+'|'+l.id+'|'+i.n+'|'+a.id,c,l,kind:'abono',label:'Abono a la cuota '+i.n,ref:a.ref,when:a.submittedOn,amount:Number(a.amount)||0,match:null,proof:a.proofData,n:i.n,abono:a.id})});
    });
  }));
  return out;
}
const verifPending=()=>clients.filter(c=>c.cr.status==='pending'&&c.u.identityDocs?.front&&c.u.identityDocs?.selfie);
const lateClients=()=>clients.filter(c=>c.overdue.length);
const allRequests=()=>{const a=[];clients.forEach(c=>c.requests.forEach(l=>a.push({c,l})));return a.sort((x,y)=>String(y.l.createdAt).localeCompare(String(x.l.createdAt)))};
function riskOf(c){if(c.overdue.length||c.u.accountBlocked)return ['Riesgo alto','bad'];if(c.cr.status!=='approved')return ['Línea sin aprobar','warn'];const paidLoans=c.loans.filter(l=>l.status==='pagado').length;if(paidLoans&&c.onTimePct!==null&&c.onTimePct>=90)return ['Riesgo bajo','ok'];return ['Riesgo medio','warn']}
/* Quincenas: del 1 al 15 y del 16 al fin de mes. */
function periodOf(iso){const d=parse(iso);const first=d.getDate()<=15;const y=d.getFullYear(),m=d.getMonth();const end=first?new Date(y,m,15):new Date(y,m+1,0);const start=first?new Date(y,m,1):new Date(y,m,16);return {start:isoOf(start),end:isoOf(end),label:fmtD(isoOf(end))}}
function prevPeriod(p){return periodOf(addDays(p.start,-1))}
function periodStats(p){
  const inP=d=>d&&d>=p.start&&d<=p.end;let lent=0,paid=0,mora=0,fees=0,ups=0;
  clients.forEach(c=>{
    c.loans.forEach(l=>{
      if(l.desembolso&&inP(l.desembolso.date))lent+=Number(l.desembolso.amount||l.amount)||0;
      const ratio=(Number(l.rate)||0)/(100+(Number(l.rate)||0));
      (l.installments||[]).forEach(i=>{
        if(i.status==='paid'&&inP(i.paidOn)){const v=Number(i.paymentAmount)||((Number(i.amount)||0)+(Number(i.mora)||0));paid+=v;mora+=Number(i.mora)||0;fees+=(Number(i.amount)||0)*ratio}
        (i.abonos||[]).forEach(a=>{if(a.status==='paid'&&inP(a.paidOn))paid+=Number(a.amount)||0});
      });
    });
    (c.s.log||[]).forEach(e=>{if(inP(e.date)&&/Subiste al nivel/i.test(e.text||''))ups++});
  });
  return {lent:r2(lent),paid:r2(paid),mora:r2(mora),fees:r2(fees),ups};
}

async function shrinkImage(file){if(!file||!file.type.startsWith('image/'))throw new Error('Selecciona una imagen.');const url=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(new Error('No se pudo leer la imagen.'));r.readAsDataURL(file)});const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('No se pudo leer la imagen.'));i.src=url});const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return await new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error('No se pudo procesar la imagen.')),'image/jpeg',0.8))}
async function uploadFor(clientId,file){const blob=await shrinkImage(file);const path=clientId+'/desembolso-'+(crypto.randomUUID?crypto.randomUUID():Date.now())+'.jpg';const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw new Error(errText(error,'No se pudo subir la captura.'));return 'sb:'+path}
function makeInstallments(l,s){const amount=Number(l.amount)||0,n=Number(l.n)||1;if(!l.total||!Number.isFinite(Number(l.total)))l.total=r2(amount*(1+(Number(l.rate)||Number(SET.rates?.[n])||0)/100));const each=r2(Number(l.total)/n),t=today();return Array.from({length:n},(_,k)=>({n:k+1,due:addDays(t,15*(k+1)),amount:k+1===n?r2(Number(l.total)-each*(n-1)):each,status:'pending',paidOn:null}))}
function applyPayment(s,l,key,parts){
  const u=s.user;const n=Number(parts[2]);
  if(parts[2]==='b'){const g=(l.installments||[]).filter(i=>i.status==='validating'&&i.bundle);if(!g.length)return 0;let v=0;g.forEach(i=>{v+=Number(i.paymentAmount)||owed(i);i.status='paid';i.paidOn=today();i.balanceDue=0});u.points=(Number(u.points)||0)+10;notifyClient(s,'Pago validado para todas las cuotas restantes.');return v}
  const i=(l.installments||[]).find(x=>Number(x.n)===n);if(!i)return 0;
  if(parts[3]){const a=(i.abonos||[]).find(x=>String(x.id)===parts[3]);if(!a||a.status!=='validating')return 0;const before=i.balanceDue!=null?Number(i.balanceDue):Number(i.amount)+(Number(i.mora)||0);a.status='paid';a.paidOn=today();i.balanceDue=r2(Math.max(0,before-Number(a.amount||0)));if(i.balanceDue<=.001){i.balanceDue=0;i.status='paid';i.paidOn=today();u.points=(Number(u.points)||0)+10}notifyClient(s,'Abono de '+money(a.amount)+' validado para la cuota '+i.n+'. Saldo restante: '+money(i.balanceDue)+'.');return Number(a.amount)||0}
  if(i.status!=='validating')return 0;const v=Number(i.paymentAmount)||owed(i);i.status='paid';i.paidOn=today();i.balanceDue=0;u.points=(Number(u.points)||0)+10;notifyClient(s,'Pago validado para la cuota '+i.n+'.');return v;
}
async function validatePayments(keys){
  const byClient={};keys.forEach(k=>{const p=k.split('|');(byClient[p[0]]=byClient[p[0]]||[]).push(p)});let total=0,okN=0;
  for(const id of Object.keys(byClient)){let sum=0;const ok=await mutate(id,s=>{sum=0;byClient[id].forEach(p=>{const l=(s.loans||[]).find(x=>String(x.id)===p[1]);if(!l)return;const v=applyPayment(s,l,null,p);if(v){sum+=v;okN++}if((l.installments||[]).length&&l.installments.every(x=>x.status==='paid'))l.status='pagado'});if(!sum)return false;logEvent(s,'Validaste '+money(sum)+' en pagos.')});if(ok)total+=sum}
  if(total)await capital(total,'Pagos validados');keys.forEach(k=>delete ui.payChecked[k]);toast(okN?'Pagos validados: '+money(total)+'.':'Nada que validar.');await refresh();
}

}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const z=e.target.closest('img[data-zoom]');if(z&&z.src){$('#modalImg').src=z.src;$('#modal').classList.remove('hidden');return}
  const a=e.target.closest('[data-act]');if(a&&!(a.tagName==='INPUT'&&a.type==='checkbox')){e.preventDefault();act(a.dataset.act,a).catch(err=>toast(err.message))}
});
document.addEventListener('change',e=>{const a=e.target.closest('input[type=checkbox][data-act]');if(a)act(a.dataset.act,a).catch(err=>toast(err.message))});
document.addEventListener('input',e=>{if(e.target.id==='bigSearch'||e.target.id==='topSearch'){ui.q=e.target.value;if(e.target.id==='topSearch'){ui.section='usuarios';render();const b=$('#bigSearch');if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}e.target.value=''}else render()}});
$('#modal').addEventListener('click',()=>$('#modal').classList.add('hidden'));document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.add('hidden')});

/* ============ sesión ============ */
let autoTimer=null;
async function enterPanel(){
  const who=await q(sb.rpc('whoami'),'No se pudo comprobar tu cuenta.');
  if(!who||(who.role!=='admin'&&who.role!=='cobrador')){await sb.auth.signOut();throw new Error(who?.role==='disabled'?'Tu cuenta del panel está desactivada. Habla con el administrador.':who?.role==='cliente'?'Esta es una cuenta de cliente: entra desde la app, no desde el panel.':'Esta cuenta no tiene acceso al panel. El administrador debe darla de alta (ver supabase/LEEME.md, paso 4).')}
  me=who;$('#rolePill').textContent=who.role==='admin'?'Administrador':'Cobrador';$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');
  await loadAll();render();
  clearInterval(autoTimer);autoTimer=setInterval(()=>{if(!document.hidden&&me&&!document.activeElement?.matches('input,textarea,select'))refresh()},30000);
}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const err=$('#loginErr');err.textContent='';if(!sb){err.textContent='Supabase no está configurado todavía.';return}const b=e.submitter||$('#loginForm button');b.disabled=true;try{const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim().toLowerCase(),password:$('#password').value});if(error)throw new Error(errText(error,'No se pudo iniciar sesión.'));$('#password').value='';await enterPanel();toast(me.role==='admin'?'Bienvenido, Señor.':'Sesión de cobrador iniciada.')}catch(ex){err.textContent=ex.message}finally{b.disabled=false}});
function logout(show){clearInterval(autoTimer);if(sb)sb.auth.signOut().catch(()=>{});me=null;clients=[];notes={};staff=[];auditRows=[];ui.sel=null;ui.q='';ui.section='hoy';$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#main').innerHTML='';if(show)toast('Sesión cerrada.')}
if(!sb){const w=$('#configWarn');w.innerHTML='<b>Falta conectar Supabase.</b> En Vercel → Settings → Environment Variables añade <span class="mono">SUPABASE_URL</span> y <span class="mono">SUPABASE_ANON_KEY</span> y vuelve a desplegar.';w.classList.remove('hidden')}
else sb.auth.getSession().then(({data})=>{if(data?.session)return enterPanel()}).catch(e=>{$('#loginErr').textContent=e.message});
</script>
</body>
</html>
