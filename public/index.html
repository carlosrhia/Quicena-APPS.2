<style>/* Táctil (Android/iPhone): iOS amplía la página si un campo tiene menos de 16px. */ input:not([type=range]):not([type=checkbox]):not([type=radio]),textarea,select{font-size:16px!important} .btn,.iconbtn{min-height:44px} 
/* Layout: app móvil de una columna (máx. 520px). El color de toda la página sale del nivel del cliente (--h y el acento); el panel del prestamista usa el color base. */
:root{
  --h:200;
  --acc-l:#E8A317; --onacc-l:#2A1B00; --acc-d:#F2B33D; --onacc-d:#2A1B00;
  --bg:hsl(var(--h) 24% 94%); --surface:hsl(var(--h) 30% 99%); --ink:hsl(var(--h) 45% 14%); --muted:hsl(var(--h) 14% 38%); --line:hsl(var(--h) 18% 84%);
  --accent:var(--acc-l); --on-accent:var(--onacc-l);
  --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
  --sea:hsl(var(--h) 55% 30%); --sea-soft:hsl(var(--h) 50% 90%);
  --ok:#1F7F4F; --ok-soft:#DDF1E5; --bad:#B93A25; --bad-soft:#FBE4DE; --warn-soft:#FBEFD2;
  --hero-bg:hsl(var(--h) 52% 22%); --hero-bg2:hsl(var(--h) 56% 14%); --hero-fg:#F4F7F7; --hero-muted:hsl(var(--h) 26% 74%); --hero-line:hsl(var(--h) 34% 34%);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
/* Ámbar, Jade, Zafiro, Rubí */
:root[data-lvl="1"]{--h:258;--acc-l:#7C5CFF;--onacc-l:#FFFFFF;--acc-d:#9D85FF;--onacc-d:#160A3D}
:root[data-lvl="2"]{--h:158;--acc-l:#2DBE82;--onacc-l:#04241A;--acc-d:#4AD8A0;--onacc-d:#04241A}
:root[data-lvl="3"]{--h:218;--acc-l:#4C8DF6;--onacc-l:#06152E;--acc-d:#6AA6FF;--onacc-d:#06152E}
:root[data-lvl="4"]{--h:348;--acc-l:#E5566F;--onacc-l:#2B0610;--acc-d:#FF7B93;--onacc-d:#2B0610}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:hsl(var(--h) 36% 8%); --surface:hsl(var(--h) 30% 13%); --ink:hsl(var(--h) 25% 93%); --muted:hsl(var(--h) 14% 68%); --line:hsl(var(--h) 22% 22%);
  --accent:var(--acc-d); --on-accent:var(--onacc-d);
  --sea:hsl(var(--h) 60% 70%); --sea-soft:hsl(var(--h) 42% 20%);
  --ok:#5CC48A; --ok-soft:#133A2B; --bad:#F0735C; --bad-soft:#44221C; --warn-soft:#3F3216;
  --hero-bg:hsl(var(--h) 46% 22%); --hero-bg2:hsl(var(--h) 50% 14%); --hero-fg:#F4F7F7; --hero-muted:hsl(var(--h) 26% 74%); --hero-line:hsl(var(--h) 34% 36%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 36% 8%); --surface:hsl(var(--h) 30% 13%); --ink:hsl(var(--h) 25% 93%); --muted:hsl(var(--h) 14% 68%); --line:hsl(var(--h) 22% 22%);
  --accent:var(--acc-d); --on-accent:var(--onacc-d);
  --sea:hsl(var(--h) 60% 70%); --sea-soft:hsl(var(--h) 42% 20%);
  --ok:#5CC48A; --ok-soft:#133A2B; --bad:#F0735C; --bad-soft:#44221C; --warn-soft:#3F3216;
  --hero-bg:hsl(var(--h) 46% 22%); --hero-bg2:hsl(var(--h) 50% 14%); --hero-fg:#F4F7F7; --hero-muted:hsl(var(--h) 26% 74%); --hero-line:hsl(var(--h) 34% 36%); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 104px;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"15";position:absolute;inset:0;display:grid;place-items:center;font:800 10px var(--font-display);color:var(--on-accent)}
.iconbtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 10px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* bloques */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hello h1{font-size:28px;font-weight:800}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.lvl b{color:var(--sea)}

.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--bad);background:var(--bad-soft);border-radius:18px;padding:12px 14px}
.alert strong{display:block}
.alert svg{width:22px;height:22px;color:var(--bad);flex:none}

/* selector de monto */
.hero{background:linear-gradient(155deg,var(--hero-bg),var(--hero-bg2));color:var(--hero-fg);border-radius:26px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px}
.hero .label{color:var(--hero-muted)}
.big{font-family:var(--font-display);font-weight:800;font-size:60px;line-height:1;letter-spacing:-.03em}
.hero input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--hero-line);background:transparent;color:var(--hero-fg);padding:7px 14px;border-radius:999px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.meter{height:8px;border-radius:4px;background:var(--hero-line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hero .row .small{color:var(--hero-muted)}
.locked{padding:6px 0;color:var(--hero-muted)}

.cuotas{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.cuotas button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 0;font-weight:700;font-family:var(--font-display);font-size:18px}
.cuotas button small{display:block;font:500 11px var(--font-body);color:var(--muted)}
.cuotas button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.cuotas button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.cuotas button:disabled{opacity:.4;cursor:not-allowed}

.quote{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px}
.kv b{font-weight:600}
.kv.main b{font-family:var(--font-display);font-size:22px;font-weight:800}
.dates{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}

.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent);width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btn.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--sea);font-weight:600;padding:6px 0}

/* listas */
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.ico{width:42px;height:42px;border-radius:13px;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.bad{background:var(--bad-soft);color:var(--bad)}
.item .t{font-weight:600}
.amt{font-family:var(--font-display);font-weight:800;font-size:19px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.sea{background:var(--sea-soft);color:var(--sea)}
.pill.warn{background:var(--warn-soft);color:var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:5px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
/* reportes del prestamista */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis .tile b{font-size:21px}
.tile small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.mchart{display:flex;align-items:flex-end;gap:8px;height:124px;padding-top:8px}
.mcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.mcol i{display:block;flex:none;width:100%;max-width:38px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.mcol span{font-size:11px;color:var(--muted)}
.mcol b{font-size:10.5px;font-weight:600;white-space:nowrap}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.sub{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid transparent;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500}
.cal button.today{border-color:var(--sea)}
.cal button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cal .dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dot.paid{background:var(--ok)}.dot.overdue{background:var(--bad)}.dot.validating{background:var(--sea)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}

/* nivel */
.stage{border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(155deg,var(--hero-bg),var(--hero-bg2));color:var(--hero-fg)}
.stage h2{font-size:34px;font-weight:800}
.stage .label{color:var(--hero-muted)}
.stage .meter{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tile{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface)}
.tile b{display:block;font-family:var(--font-display);font-size:24px;font-weight:800}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center}
.steps li.on{font-weight:700}
.steps li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px;flex:none}
.steps li.on span{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.nav nav{position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;isolation:isolate;overflow:hidden}
.nav-bubble{position:absolute;z-index:0;top:5px;bottom:5px;left:6px;width:calc((100% - 12px)/4);border-radius:20px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 43%,white),color-mix(in srgb,var(--accent) 23%,transparent));border:1px solid color-mix(in srgb,var(--accent) 42%,white);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.78),inset 0 -1px 0 rgba(255,255,255,.16),0 7px 18px -8px var(--accent);backdrop-filter:blur(22px) saturate(210%);-webkit-backdrop-filter:blur(22px) saturate(210%);transform:translateX(0);transition:transform .62s cubic-bezier(.22,1.42,.34,1),border-radius .28s ease,filter .25s ease;will-change:transform;pointer-events:none}
.nav-bubble::before{content:"";position:absolute;left:8%;right:8%;top:2px;height:46%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.05));opacity:.72}
.nav-bubble::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.20),transparent 45%,rgba(255,255,255,.08));pointer-events:none}
.nav nav:has(button:active) .nav-bubble{filter:saturate(1.18)}
.nav nav button{min-width:0}
.nav nav button{position:relative;z-index:1;transition:transform .25s cubic-bezier(.2,1.4,.4,1),color .2s ease}
.nav nav button:active{transform:scale(.92)}
.nav button{border:0;background:transparent;border-radius:16px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);background:transparent}

/* hojas */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,15,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:22px}
/* Los hijos de la hoja nunca se comprimen: si el contenido no cabe, la hoja hace scroll (antes los botones se aplastaban y el texto se cortaba) */
.sheet>*{flex-shrink:0}
.sheet>.btn{flex-shrink:0}
.sheet .btn{min-height:50px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.sheet .btn.sm{min-height:44px}
.sheet{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:11px 13px}
.opt b{font-weight:600}
/* Autenticación por correo: flujo de demostración local */
.auth-options{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.auth-note{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-size:13px}
.auth-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:800;letter-spacing:.22em;text-align:center;padding:14px;border-radius:14px;background:var(--sea-soft);color:var(--sea);border:1px dashed var(--sea)}
.auth-email{overflow-wrap:anywhere;font-weight:700}
.auth-title{font-family:var(--font-display);font-size:27px;font-weight:800;letter-spacing:-.03em;text-align:center}
.auth-scrim{align-items:center;background:var(--bg);padding:18px 0;-webkit-backdrop-filter:none;backdrop-filter:none}
.auth-scrim .sheet{width:calc(100% - 24px);max-height:92vh;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field input[type=number],.field input[type=password]{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;width:100%}
.field input[type=file]{border:1px dashed var(--line);border-radius:14px;padding:12px;background:var(--surface);width:100%}
.proof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px}
.proof img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.proofimg{width:100%;max-width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--surface)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.info{background:var(--warn-soft);border-radius:14px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 16px;font-weight:600;max-width:min(92vw,420px)}
.note{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.note:last-child{border:0}
.note i{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.note.read i{background:var(--line)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (max-width:380px){.big{font-size:50px}.hello h1{font-size:24px}}

/* ===== Cristal líquido: superficies translúcidas con desenfoque, borde de luz y fondo que cambia con el nivel ===== */
:root{--glass-hi:rgba(255,255,255,.65);--glass-edge:rgba(255,255,255,.75);--glass-shadow:rgba(10,30,50,.10);--blob-a:.42;--glass-a:84%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass-hi:rgba(255,255,255,.14);--glass-edge:rgba(255,255,255,.16);--glass-shadow:rgba(0,0,0,.35);--blob-a:.30}}
:root[data-theme="dark"]{--glass-hi:rgba(255,255,255,.14);--glass-edge:rgba(255,255,255,.16);--glass-shadow:rgba(0,0,0,.35);--blob-a:.30}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--glass-a:56%}}
body{
  background-color:var(--bg);
  transition:background-color .5s ease}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(62% 34% at 8% 0%,hsl(var(--h) 85% 62%/var(--blob-a)),transparent 72%),
    radial-gradient(52% 30% at 100% 24%,hsl(calc(var(--h) + 34) 85% 64%/calc(var(--blob-a)*.8)),transparent 72%),
    radial-gradient(70% 36% at 0% 100%,hsl(calc(var(--h) - 28) 85% 60%/calc(var(--blob-a)*.9)),transparent 72%);}
.card,.item,.tile,.opt,.proof,.iconbtn,.lvl,.seg,.cuotas button,.sheet,.nav nav,.toast,.alert,.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=file],.info{
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
.card,.item,.tile,.opt,.proof,.iconbtn,.lvl,.seg,.cuotas button,.nav nav{
  background:color-mix(in srgb,var(--surface) var(--glass-a),transparent);
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 28px -12px var(--glass-shadow)}
.card[style*="background"]{background:color-mix(in srgb,var(--bg) 60%,transparent)!important}
.proof{background:color-mix(in srgb,var(--bg) 50%,transparent)}
.opt[aria-pressed="true"]{border:2px solid var(--accent);box-shadow:inset 0 1px 0 var(--glass-hi),0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.cuotas button[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));border-color:color-mix(in srgb,var(--accent) 60%,white);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 20px -8px var(--accent)}
.cuotas button[aria-pressed="true"] small{color:var(--on-accent)}
.seg button{border-radius:12px;transition:background .2s ease}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,white),var(--ink));color:var(--bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 12px -4px var(--glass-shadow)}
.alert{background:color-mix(in srgb,var(--bad-soft) 68%,transparent);border:1px solid color-mix(in srgb,var(--bad) 55%,transparent);box-shadow:inset 0 1px 0 var(--glass-hi)}
.info{background:color-mix(in srgb,var(--warn-soft) 72%,transparent);border:1px solid var(--glass-edge)}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=file]{background:color-mix(in srgb,var(--surface) 62%,transparent);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 2px var(--glass-shadow)}

/* botones con brillo de gota */
.btn{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 55%,white);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 62%,white) 0%,var(--accent) 52%,color-mix(in srgb,var(--accent) 86%,black) 100%);
  color:var(--on-accent);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.14),0 12px 24px -10px var(--accent);
  transition:transform .15s ease,box-shadow .2s ease}
.btn::before{content:"";position:absolute;left:6%;right:6%;top:2px;height:46%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:scale(.97)}
.btn.dark{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 78%,white),var(--ink));color:var(--bg);border-color:color-mix(in srgb,var(--ink) 60%,white);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),0 12px 24px -12px var(--glass-shadow)}
.btn.dark::before{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.btn.ghost,.btn.bad{background:color-mix(in srgb,var(--surface) var(--glass-a),transparent);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);color:var(--ink);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 20px -12px var(--glass-shadow)}
.btn.ghost::before,.btn.bad::before{background:linear-gradient(180deg,var(--glass-hi),rgba(255,255,255,0))}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn:disabled{box-shadow:none}

/* tarjetas grandes de color */
.hero,.stage{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -24px 40px -24px rgba(0,0,0,.25),0 22px 40px -22px hsl(var(--h) 70% 20%/.7)}
.hero::before,.stage::before{content:"";position:absolute;inset:-40% -20% auto auto;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,hsl(calc(var(--h) + 20) 90% 70%/.55),transparent 66%);pointer-events:none}
.hero::after,.stage::after{content:"";position:absolute;inset:0 0 auto 0;height:44%;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));pointer-events:none}
.hero>*,.stage>*{position:relative;z-index:1}
.chip{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 62%,white),var(--accent));border-color:color-mix(in srgb,var(--accent) 55%,white);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 16px -6px var(--accent)}
.meter,.bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.meter i,.bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,white),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.bar i{background:linear-gradient(90deg,color-mix(in srgb,var(--sea) 70%,white),var(--sea))}

/* navegación, hojas y avisos */
.nav{background:linear-gradient(to top,color-mix(in srgb,var(--bg) 80%,transparent) 55%,transparent)}
.nav nav{border-radius:26px;box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 36px -14px var(--glass-shadow)}
.nav button[aria-current="page"]{background:transparent;box-shadow:none;color:var(--ink)}
.scrim{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet{background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--glass-edge);border-bottom:0;box-shadow:inset 0 1px 0 var(--glass-hi),0 -20px 50px -20px var(--glass-shadow)}
.toast{background:color-mix(in srgb,var(--ink) 82%,transparent);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.pill{background:color-mix(in srgb,var(--line) 70%,transparent)}
.pill.ok{background:color-mix(in srgb,var(--ok-soft) 80%,transparent)}.pill.bad{background:color-mix(in srgb,var(--bad-soft) 80%,transparent)}.pill.sea{background:color-mix(in srgb,var(--sea-soft) 80%,transparent)}.pill.warn{background:color-mix(in srgb,var(--warn-soft) 85%,transparent)}
.ico{box-shadow:inset 0 1px 0 var(--glass-hi)}
.brand i{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 60%,white),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
/* Perfil, onboarding, mascotas y gesto de contrato */
.top-actions{display:flex;align-items:center;gap:8px}
.loan-swipe-wrap{position:relative;overflow:hidden;border-radius:22px;min-width:0}
.loan-reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:10px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,transparent),color-mix(in srgb,var(--sea) 24%,transparent));border:1px solid var(--glass-edge);border-radius:22px;overflow:hidden}
.loan-reveal-inner{width:61%;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;font-size:11px;overflow-y:auto;overflow-x:hidden;padding:4px 0;overscroll-behavior:contain}
.loan-reveal-inner img{width:70px;height:54px;object-fit:cover;border-radius:10px;border:1px solid var(--glass-edge);flex:none}
.loan-reveal-inner .receipt-amount{font:800 17px var(--font-display);color:var(--sea)}
.loan-reveal-inner .link{font-size:11px;text-align:left;white-space:normal}
.loan-front{position:relative;z-index:1;transition:transform .42s cubic-bezier(.22,1.15,.36,1);touch-action:pan-y;will-change:transform}
.loan-swipe-wrap.revealed .loan-front{transform:translateX(-64%);box-shadow:0 12px 30px -15px var(--glass-shadow)}

.loan-swipe-wrap.peek .loan-front{animation:peek 1.9s cubic-bezier(.45,0,.2,1)}

.ptabs{position:sticky;top:6px;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ===== Perfil personal inspirado en la referencia móvil ===== */

/* Los tres iconos heredan el matiz del nivel activo y comparten acabado 3D tipo vidrio pulido. */.id-icon{border-radius:17px 17px 14px 17px;}.mail-icon{border-radius:17px 14px 17px 14px;}.phone-icon{border-radius:15px 18px 15px 18px;}

.profile-edit:active,.profile-tutorial:active{opacity:.72;}

.profile-edit-back{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--accent);font-weight:600;padding:4px 0 10px;width:fit-content;}

/* Racha grande con llama viva y mascotas más visibles */
.streak-card{overflow:hidden;}

.pets{gap:10px;}

.pet-spark{position:absolute;right:9px;top:8px;font-size:17px;color:var(--accent);opacity:.78;animation:sparkTwinkle 1.9s ease-in-out infinite;}
.pet.locked{filter:grayscale(1);opacity:.72;border-color:rgba(150,150,155,.32);background:linear-gradient(155deg,#343437,#202023);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 20px -14px rgba(0,0,0,.4)}
.pet.locked .face{filter:grayscale(1) drop-shadow(0 5px 5px rgba(0,0,0,.22));animation:none}
.pet.locked .pet-spark{color:#888;opacity:.25;animation:none}
.pet-ability{display:block;min-height:30px;margin:7px 0 0;font-size:10px;line-height:1.35;color:var(--muted)}
.pet-choice{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;margin:8px 0;min-height:70px}.pet-choice-action{grid-column:2 / -1;justify-self:end;color:var(--accent);font-size:12px;font-weight:700}.pet-choice .grow{min-width:0}.pet-use{display:block;width:100%;min-height:34px;margin:9px auto 0;padding:7px 5px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--glass-edge));border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),color-mix(in srgb,var(--accent) 8%,var(--surface)));color:var(--ink);font:700 10px var(--font-body);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px -7px var(--accent)}
.pet-use:disabled{opacity:.52;filter:saturate(.4);box-shadow:none;cursor:not-allowed}
.pet-use:not(:disabled):active{transform:translateY(1px) scale(.98)}
@keyframes flameLive{0%{transform:rotate(-7deg) scale(.96,1.02)}45%{transform:rotate(5deg) scale(1.07,.94)}100%{transform:rotate(-2deg) scale(1.02,1.08)}}
@keyframes sparkTwinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.18) rotate(20deg)}}

/* La burbuja acompaña el dedo y se estira al deslizar, con rebote tipo iOS */

.nav-bubble.settling{transition:transform .56s cubic-bezier(.18,1.48,.34,1),border-radius .28s ease,filter .25s ease;}

.nav-bubble::before{opacity:.82;}
@media(max-width:390px){.profile-row{gap:9px;padding-inline:9px}.profile-flag,.profile-icon{width:44px;min-width:44px;height:44px}.profile-row-text strong{font-size:14px}.profile-edit{font-size:13px}.streak-score{min-width:104px;padding:8px 9px}.streak-flame{font-size:31px}.pet{min-height:136px}}

/* ===== v14: correcciones móviles, modo oscuro manual, animaciones y rendimiento ===== */
html{-webkit-text-size-adjust:100%;background-color:var(--bg);overscroll-behavior-y:none;min-height:100%}
body{overscroll-behavior-y:none;min-height:100vh;min-height:100dvh}
body::before{top:-35vh!important;bottom:-35vh!important;left:0;right:0}
.profile-sheet,.sheet,.scrim{overscroll-behavior:none}
/* notificaciones */
.nt-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nt-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.nt-perm{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nt-perm .ico{font-size:24px}.nt-perm b{display:block}.nt-perm .grow{flex:1;min-width:0}
.nt-group{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.nt-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.nt-item .nt-ic{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.nt-item.bad .nt-ic{background:var(--bad-soft)}.nt-item.ok .nt-ic{background:var(--ok-soft)}
.nt-item .nt-tx{flex:1;min-width:0;font-size:14px;line-height:1.4}
.nt-item .nt-tm{font-size:12px;color:var(--muted);margin-top:3px}
.nt-item.unread{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.nt-item.unread .nt-tx{font-weight:600}
.nt-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 9px;margin-top:6px}
button,.item,.chip,.opt,.iconbtn,.pet-use{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* iOS amplía toda la página al enfocar un campo con letra menor a 16px: se evita */
.field input,.field select,.field textarea{font-size:16px}
/* hojas: sin desbordes laterales y con los botones de una fila apilados (el principal arriba, cancelar abajo) */
.sheet{overflow-x:hidden;overscroll-behavior:contain}
.sheet>*{min-width:0;max-width:100%}
.sheet .row:has(>.btn){flex-direction:column-reverse;align-items:stretch;justify-content:flex-start}
.sheet .row:has(>.btn)>.btn{width:100%}
.sheet-open{overflow:hidden}

/* botón de tema (luna/sol): pequeño, arriba a la derecha */
.iconbtn.sm{width:36px;height:36px;border-radius:12px}
.iconbtn.sm svg{width:18px;height:18px}
.themebtn{color:var(--ink)}

/* modo oscuro: la burbuja de navegación y las mascotas usan el color del nivel en vez de mezclarse con blanco */
:root{--bub1:color-mix(in srgb,var(--accent) 43%,white);--bub2:color-mix(in srgb,var(--accent) 23%,transparent);--bubedge:color-mix(in srgb,var(--accent) 42%,white);--bubshine:.82}

:root[data-theme="dark"]{--bub1:color-mix(in srgb,var(--accent) 46%,#0b1116);--bub2:color-mix(in srgb,var(--accent) 22%,transparent);--bubedge:color-mix(in srgb,var(--accent) 60%,transparent);--bubshine:.26}
.nav-bubble{background:linear-gradient(145deg,var(--bub1),var(--bub2));border:1px solid var(--bubedge)}
.nav-bubble::before{opacity:var(--bubshine)}
.pet{background:linear-gradient(160deg,color-mix(in srgb,var(--surface) 90%,var(--accent)),color-mix(in srgb,var(--accent) 12%,var(--surface)))}

/* rendimiento: se quita el desenfoque de las tarjetas (sobre un fondo suave no se nota) y se conserva en barra, hojas y avisos */
:root{--glass-a:78%}
.card,.item,.tile,.opt,.proof,.lvl,.seg,.cuotas button,.alert,.info,.chip,.btn.ghost,.btn.bad,.pet,
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=file]{-webkit-backdrop-filter:none;backdrop-filter:none}
.scrim{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

/* transición suave al cambiar de tema */
:root.theme-anim *,:root.theme-anim *::before,:root.theme-anim *::after{transition:none!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.26s;animation-timing-function:ease-out}

/* microinteracciones */
.item,.chip,.cuotas button,.opt,.iconbtn,.profile-support-row,.pet-use{transition:transform .18s cubic-bezier(.2,1.2,.4,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.item:active,.chip:active,.cuotas button:active,.opt:active,.iconbtn:active,.profile-support-row:active{transform:scale(.97)}
@media (hover:hover){.item:hover,.opt:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--glass-hi),0 14px 30px -14px var(--glass-shadow)}.iconbtn:hover{transform:translateY(-1px)}}

/* animaciones de entrada (solo al cambiar de pantalla, no en cada toque) */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes colGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes themeSpin{from{transform:rotate(-100deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .app.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  .app.enter>:nth-child(2){animation-delay:.04s}.app.enter>:nth-child(3){animation-delay:.08s}.app.enter>:nth-child(4){animation-delay:.12s}
  .app.enter>:nth-child(5){animation-delay:.16s}.app.enter>:nth-child(6){animation-delay:.2s}.app.enter>:nth-child(7){animation-delay:.24s}
  .app.enter>:nth-child(n+8){animation-delay:.28s}
  .app.enter .meter i,.app.enter .bar i{transform-origin:left center;animation:barGrow .8s .2s cubic-bezier(.2,.8,.2,1) both}
  .app.enter .mcol i{transform-origin:bottom center;animation:colGrow .7s .2s cubic-bezier(.2,.8,.2,1) both}
  .scrim{animation:fadeIn .22s ease-out}
  .scrim.still,.scrim.still .sheet{animation:none}
  .toast:not([hidden]){animation:toastIn .28s cubic-bezier(.2,1.2,.4,1)}
  .themebtn.spin svg{animation:themeSpin .5s cubic-bezier(.2,1.3,.4,1)}
}
@media (prefers-reduced-motion:reduce){
  .app.enter>*,.scrim,.toast,.themebtn svg,.meter i,.bar i,.mcol i{animation:none!important}
  :root.theme-anim *{transition:none!important}
}

/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
let SHIFT=0;
const today=()=>{const d=new Date();if(SHIFT)d.setDate(d.getDate()+SHIFT);return iso(d)};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const fmtD=s=>{const d=parse(s);return d.getDate()+' '+MES[d.getMonth()]};
const r2=n=>Math.round(n*100)/100;
const money=n=>'$'+r2(n).toLocaleString('es',{minimumFractionDigits:r2(n)%1?2:0,maximumFractionDigits:2});
const dueText=s=>{const d=diff(s,today());return d<0?'Venció hace '+(-d)+(d===-1?' día':' días'):d===0?'Vence hoy':d===1?'Vence mañana':'En '+d+' días'};

/* Nivel 1 paga en 1 a 2 cuotas; niveles 2 a 4 en 1 a 3 (más cuotas, más interés). Cada nivel tiene su color (h = tono) y su tope de préstamo. */
const LEVELS=[
 {name:'Ámbar',min:0,limit:50,maxN:2,h:258},
 {name:'Jade',min:121,limit:70,maxN:3,h:158},

let GS={};
function applySettings(d){
  if(!d||typeof d!=='object')return;
  GS=d;
  if(Array.isArray(d.levels))d.levels.forEach((x,k)=>{if(LEVELS[k]&&x){const lim=Number(x.limit),mx=Number(x.maxN);if(lim>0)LEVELS[k].limit=lim;if(mx>=1&&mx<=3)LEVELS[k].maxN=mx}});
  if(Number(d.pipoMax)>=0)PIPO_MAX=Number(d.pipoMax);
}

const KEY='quincena.v8';
function seed(){
  const t=today(), start=addDays(t,-20);
  const mk=(id,amount,n,startD,paidN)=>{
    const rate=DEFAULT_RATES[n], total=r2(amount*(1+rate/100)), c=r2(total/n);
    const inst=[];
    for(let k=1;k<=n;k++){
      const due=addDays(startD,GAP_DAYS*k);
      inst.push({n:k,due,amount:k===n?r2(total-c*(n-1)):c,status:k<=paidN?'paid':'pending',paidOn:k<=paidN?due:null});
    }
    return {id,amount,n,rate,total,status:paidN===n?'pagado':'activo',method:'pm',createdAt:startD,startedAt:startD,installments:inst};
  };
  return {
    v:3,
    shift:0,
    config:{mora:MORA_DEFAULT,rates:{1:DEFAULT_RATES[1],2:DEFAULT_RATES[2],3:DEFAULT_RATES[3]},methods:[
      {id:'pm',name:'Pago móvil',detail:'Banco 0191 (BNC) · Tel. 0424-8411730 · C.I. V-31513004'}]},
    user:{name:'Carlos',points:241,streak:10,petBonusCredit:0,petMoraDiscount:0,pipo:{m:'',c:0},tutorialDone:false,profile:{phone:'',email:'',ci:''}},
    loans:[mk(3,90,3,t,0),mk(2,20,2,addDays(t,-80),2)],
    notes:[{id:1,to:'cliente',text:'Perfil de prueba listo: nivel Zafiro, 10 días de racha y una línea de crédito usada. Abre Calendario para elegir la cuota en las habilidades de Pipo y Michi.',date:t,read:false}],
    seq:4
  };
}

/* ============ conexión con Supabase (cuentas, expedientes e imágenes) ============ */
/* La configuración llega desde /api/config (variables de entorno de Vercel) o desde config.js.
   Sin configuración la app funciona en modo local, solo en este dispositivo. Ver supabase/LEEME.md. */
const Backend={
  cfg:(typeof window!=='undefined'&&window.QUINCENA_CONFIG)||{},
  sb:null,url:'',enabled:true,on:false,status:'local',ver:0,clientId:'',activeClientId:'',clients:[],
  busy:false,again:false,timer:null,poll:null,pending:null,retryTimer:null,
  ciKey:'quincena.clientCi',sessionKey:'quincena.auth',bucket:'documentos',
  load(){
    this.url=String(this.cfg.url||'').trim();
    // Versiones anteriores guardaban la contraseña en el navegador: se borra.
    try{localStorage.removeItem('quincena.clientPass');localStorage.removeItem('quincena.server')}catch(e){}
    if(!this.url||!this.cfg.anonKey||typeof supabase==='undefined'||!supabase||typeof supabase.createClient!=='function')return;
    try{this.sb=supabase.createClient(this.url,this.cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:this.sessionKey}})}catch(e){this.sb=null}
  },
  configured(){return !!this.sb},
  hasSavedSession(){try{return !!localStorage.getItem(this.sessionKey)}catch(e){return false}},
  isStaff(){return false},
  /* La cédula es el usuario: V-12345678 → v12345678@clientes.quincena.app (correo interno, no se envía nada). */
  emailFor(ci){let k=String(ci||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(/^\d/.test(k))k='V'+k;return k.toLowerCase()+'@clientes.quincena.app'},
  errMsg(e,fallback){
    const m=String((e&&(e.message||e.error_description||e.error))||'');
    if(/Invalid login credentials/i.test(m))return 'Cédula o contraseña incorrectas.';
    if(/already registered|already been registered|already exists/i.test(m))return 'Esa cédula ya tiene cuenta. Inicia sesión con tu cédula y contraseña.';
    if(/Email not confirmed/i.test(m))return 'La cuenta espera confirmación por correo. El administrador debe desactivar «Confirm email» en Supabase.';
    if(/rate limit|too many/i.test(m))return 'Demasiados intentos. Espera unos minutos.';
    if(/Password should be/i.test(m))return 'La contraseña es demasiado corta o sencilla.';
    if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'Sin conexión con el servidor. Revisa tu internet e inténtalo de nuevo.';
    if(/JWT|not authenticated/i.test(m))return 'Tu sesión caducó. Vuelve a entrar.';
    return m||fallback||'No se pudo completar la acción.';
  },
  loadPass(){try{return {ci:localStorage.getItem(this.ciKey)||''}}catch(e){return {}}},
  savePass(ci){try{localStorage.setItem(this.ciKey,String(ci||'').toUpperCase())}catch(e){}},
  clearPass(){},
  cache(){if(ui.role==='cliente'&&this.clientId){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}},
  currentId(){return ui.role==='prestamista'?this.activeClientId:this.clientId},
  statePath(){return this.currentId()||null},
  tok(){return this.on?'supabase':''},
  base(){return this.url||location.origin},
  /* Sube una imagen (data URL) a la carpeta privada del cliente y devuelve la referencia "sb:carpeta/archivo". */
  async putImage(folder,dataUrl,prefix){
    if(!this.sb||!folder)throw new Error('Sin conexión con el servidor.');
    const blob=await (await fetch(dataUrl)).blob();
    const type=/^image\/(jpeg|png|webp)$/.test(blob.type)?blob.type:'image/jpeg';
    const ext=type==='image/png'?'png':type==='image/webp'?'webp':'jpg';
    const rnd=(crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
    const path=folder+'/'+(prefix||'img')+'-'+rnd+'.'+ext;
    const {error}=await this.sb.storage.from(this.bucket).upload(path,blob,{contentType:type,upsert:false});
    if(error)throw error;
    return 'sb:'+path;
  },
  async signedUrl(ref){
    const path=String(ref||'').replace(/^sb:/,'');
    const {data,error}=await this.sb.storage.from(this.bucket).createSignedUrl(path,3600);
    if(error||!data)throw error||new Error('Imagen no disponible');
    return data.signedUrl;
  },
  /* Crear cuenta: usuario de Supabase (cédula + contraseña), fotos al almacenamiento privado y expediente. */
  async signup(ci,pass){
    if(!this.sb)return {ok:false,error:'La app aún no está conectada a Supabase. Avísale al prestamista.'};
    const email=this.emailFor(ci), name=String(S.user.fullName||S.user.name||'').trim();
    try{
      let uid=null;
      const r=await this.sb.auth.signUp({email,password:pass,options:{data:{full_name:name,ci}}});
      if(r.error){
        if(!/already registered|already been registered|already exists/i.test(r.error.message))return {ok:false,error:this.errMsg(r.error,'No se pudo crear la cuenta.')};
        // Registro anterior a medias: con la misma contraseña se completa; si ya hay expediente, toca iniciar sesión.
        const li=await this.sb.auth.signInWithPassword({email,password:pass});
        if(li.error)return {ok:false,error:'Esa cédula ya tiene cuenta. Inicia sesión con tu cédula y contraseña.'};
        uid=li.data.user.id;
        const ex=await this.sb.from('clients').select('id').eq('id',uid).maybeSingle();
        if(ex.data){await this.sb.auth.signOut();return {ok:false,error:'Esa cédula ya tiene cuenta. Inicia sesión con tu cédula y contraseña.'}}
      }else{
        if(!r.data||!r.data.session)return {ok:false,error:'La cuenta quedó esperando confirmación por correo. El administrador debe desactivar «Confirm email» en Supabase (Authentication → Sign In / Providers → Email) y luego podrás crearla.'};
        uid=r.data.user.id;
      }
      const docs=Object.assign({},S.user.identityDocs||{});
      for(const k of ['front','back','selfie'])if(docs[k]&&/^data:image\//.test(docs[k]))docs[k]=await this.putImage(uid,docs[k],k);
      S.user.identityDocs=docs;
      const ins=await this.sb.from('clients').insert({id:uid,name,ci,state:S}).select('version,state').single();
      if(ins.error)throw ins.error;
      await this.loadSettings();
      this.clientId=uid;this.savePass(ci);this.on=true;this.status='online';
      this.ver=ins.data.version;S=ins.data.state;SHIFT=S.shift||0;this.cache();this.startPoll();
      return {ok:true};
    }catch(e){return {ok:false,error:this.errMsg(e,'No se pudo crear la cuenta.')}}
  },
  async login(ci,pass){
    if(!this.sb)return {ok:false,error:'La app aún no está conectada a Supabase. Avísale al prestamista.'};
    try{
      const r=await this.sb.auth.signInWithPassword({email:this.emailFor(ci),password:pass});
      if(r.error)return {ok:false,error:this.errMsg(r.error,'No se pudo iniciar sesión.')};
      const row=await this.sb.from('clients').select('id,version,state').eq('id',r.data.user.id).maybeSingle();
      if(row.error)return {ok:false,error:this.errMsg(row.error,'No se pudo abrir tu expediente.')};
      if(!row.data){await this.sb.auth.signOut();return {ok:false,error:'Tu registro quedó incompleto. Pulsa «Crear cuenta» y repítelo con la misma cédula y contraseña.'}}
      await this.loadSettings();
      this.clientId=row.data.id;this.savePass(ci);this.on=true;this.status='online';
      this.ver=row.data.version;S=row.data.state;SHIFT=S.shift||0;this.cache();this.startPoll();
      return {ok:true};
    }catch(e){return {ok:false,error:this.errMsg(e,'No se pudo iniciar sesión.')}}
  },
  async loadSettings(){
    if(!this.sb)return;
    try{const {data}=await this.sb.from('app_settings').select('data').eq('id',1).maybeSingle();if(data&&data.data){applySettings(data.data);this.settingsAt=Date.now()}}catch(e){}
  },
  async logoutClient(){this.stop();this.clientId='';this.ver=0;this.pending=null;try{if(this.sb)await this.sb.auth.signOut()}catch(e){}},
  /* El personal trabaja en /admin.html; desde la app del cliente no se abren expedientes ajenos. */
  async fetchClients(){return this.clients||[]},
  async selectClient(){toast('El panel del prestamista está en /admin.html.');return false},
  /* Al abrir la app: si hay sesión guardada, se carga el expediente del cliente. */
  async connect(){
    if(!this.sb){this.on=false;this.status='local';return false}
    try{
      const {data}=await this.sb.auth.getSession();
      const sess=data&&data.session;
      if(!sess){this.on=false;this.status='auth';return false}
      const row=await this.sb.from('clients').select('id,version,state').eq('id',sess.user.id).maybeSingle();
      if(row.error)throw row.error;
      if(!row.data){this.on=false;this.status='auth';return false}
      await this.loadSettings();
      this.clientId=row.data.id;this.on=true;this.status='online';
      this.apply({version:row.data.version,state:row.data.state});
      this.startPoll();
      return true;
    }catch(e){this.on=false;this.status='offline';this.scheduleRetry();return false}
  },
  scheduleRetry(){clearTimeout(this.retryTimer);this.retryTimer=setTimeout(()=>{this.connect().then(ok=>{if(ok)afterConnect()})},10000)},
  startPoll(){
    clearInterval(this.poll);
    this.poll=setInterval(()=>{
      if(document.hidden||!this.on)return;
      if(this.pending&&!ui.sheet){this.apply(this.pending);return}
      if(Date.now()-(this.settingsAt||0)>120000)this.loadSettings().then(()=>{if(!ui.sheet)render()});
      this.pull().catch(()=>{this.status='offline'});
    },8000);
  },
  stop(){clearInterval(this.poll);clearTimeout(this.timer);clearTimeout(this.retryTimer);this.on=false},
  apply(d){
    if(!d||!d.state||d.state.v!==3)return;
    Push.fromNotes(d.state);
    S=d.state;this.ver=d.version;SHIFT=S.shift||0;this.pending=null;
    this.cache();render();renderSheet();
  },
  async pull(first){
    const id=this.currentId();if(!id||!this.sb)return;
    const {data,error}=await this.sb.from('clients').select('version,state').eq('id',id).gt('version',this.ver).maybeSingle();
    if(error){if(/JWT|auth/i.test(error.message||''))await this.unauthorized();else this.status='offline';return}
    this.status='online';
    if(!data)return;
    if(ui.sheet&&!first){this.pending=data;return}
    this.apply(data);
  },
  async refresh(){
    const id=this.currentId();if(!id||!this.sb)return;
    const {data}=await this.sb.from('clients').select('version,state').eq('id',id).maybeSingle();
    if(data)this.apply(data);
  },
  queue(){if(!this.on||!this.currentId())return;clearTimeout(this.timer);this.timer=setTimeout(()=>{this.timer=null;this.push()},350)},
  /* Guarda el expediente con control de versión: si otro dispositivo (o el prestamista) lo cambió antes, se recarga. */
  async push(){
    if(!this.on||!this.currentId())return;
    if(this.busy){this.again=true;return}
    this.busy=true;
    try{
      const {data,error}=await this.sb.from('clients').update({state:S}).eq('id',this.currentId()).eq('version',this.ver).select('version');
      if(error){
        if(/JWT|auth/i.test(error.message||''))await this.unauthorized();
        else{toast(this.errMsg(error,'Acción no permitida.'));await this.refresh()}
      }else if(data&&data.length){this.ver=data[0].version;this.status='online'}
      else{await this.refresh();toast('Tu expediente se actualizó desde otro dispositivo. Repite tu última acción.')}
    }catch(e){this.status='offline'}
    finally{this.busy=false;if(this.again){this.again=false;this.queue()}}
  },
  async upload(dataUrl){return await this.putImage(this.currentId(),dataUrl,'comprobante')},
  async unauthorized(){
    this.stop();this.status='auth';
    ui.err='Tu sesión caducó. Vuelve a entrar con tu cédula y contraseña.';ui.sheet={type:'authHome'};render();renderSheet();
  }
};

function afterConnect(){
  try{Push.seen(S.notes.filter(n=>n.read).map(n=>n.id));Push.reminders()}catch(e){}

  else if(Backend.configured()&&!Backend.on&&Backend.status==='auth'&&!(ui.sheet&&['authHome','signup','tutorial'].includes(ui.sheet.type))){ui.sheet={type:'authHome'};renderSheet()}
  hydratePrivateImages(document);
}

/* ============ notificaciones en el teléfono ============ */
/* Muestra en el teléfono los avisos nuevos del prestamista y el recordatorio del día anterior al vencimiento.
   Funcionan con la app abierta o en segundo plano. Para recibirlas con la app cerrada hace falta un servidor de envío (Web Push). */
const Push={
  key:'quincena.notified',
  state(){try{const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);if(typeof Notification==='undefined')return ios&&!standalone?'ios-install':'unsupported';return Notification.permission}catch(e){return 'unsupported'}},
  async ask(){try{if(typeof Notification==='undefined')return 'unsupported';const r=await Notification.requestPermission();if(r==='granted'){this.seen(S.notes.map(n=>n.id));this.reminders()}return r}catch(e){return 'unsupported'}},
  seenSet(){try{return new Set(JSON.parse(localStorage.getItem(this.key)||'[]'))}catch(e){return new Set()}},
  seen(ids){try{const s=this.seenSet();ids.forEach(i=>s.add(String(i)));localStorage.setItem(this.key,JSON.stringify([...s].slice(-400)))}catch(e){}},
  async show(title,body,tag){
    if(this.state()!=='granted')return false;
    const opt={body,tag:tag||'quincena',icon:'icon-192.png',badge:'icon-192.png',data:{url:location.href.split('#')[0]}};
    try{if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(title,opt);return true}}}catch(e){}
    try{new Notification(title,opt);return true}catch(e){return false}
  },
  fromNotes(next){
    if(ui.role!=='cliente'||this.state()!=='granted'||!next||!Array.isArray(next.notes))return;
    const seen=this.seenSet(),fresh=next.notes.filter(n=>n.to==='cliente'&&!n.read&&!seen.has(String(n.id)));
    if(!fresh.length)return;
    this.seen(fresh.map(n=>n.id));
    fresh.slice(0,3).forEach(n=>this.show('Quincena',n.text,'n'+n.id));
  },
  reminders(){
    if(ui.role!=='cliente'||this.state()!=='granted'||!isRegistered())return;
    const seen=this.seenSet(),t=today(),out=[];
    reminders().forEach(r=>{const k='r'+t+':'+r.text;if(!seen.has(k)){out.push(k);this.show('Quincena · recordatorio',r.text,k)}});
    if(out.length)this.seen(out);
  }
};

/* ============ cálculos ============ */
const level=()=>{const o=Number(S.user.levelOverride);if(o>=1&&o<=LEVELS.length)return LEVELS[o-1];let L=LEVELS[0];LEVELS.forEach(l=>{if(S.user.points>=l.min)L=l});return L};
const nextLevel=()=>LEVELS[LEVELS.indexOf(level())+1]||null;
const instStatus=i=>i.status==='pending'&&i.due<today()?(abonoCoversInTime(i)?'validating':'overdue'):i.status;
const unpaid=l=>l.installments.filter(i=>i.status!=='paid');
const usedLine=()=>S.loans.reduce((s,l)=>{
  if(l.status==='activo')return s+l.amount*unpaid(l).length/l.n;
  if(l.status==='solicitud')return s+l.amount;
  return s},0);
const isLate=i=>(i.status==='pending'&&i.due<today()&&!abonoCoversInTime(i))||(i.status==='validating'&&i.submittedOn>i.due);
const blocked=()=>S.loans.some(l=>l.status==='activo'&&l.installments.some(isLate));
const owed=i=>i.balanceDue!=null?r2(Math.max(0,i.balanceDue)):r2(i.amount+(i.mora||0));
/* Si el cliente envió a tiempo un abono que cubre todo el saldo y el prestamista aún no lo valida, no se cobra mora por la demora de la revisión */
const abonoCoversInTime=i=>(i.abonos||[]).some(a=>a.status==='validating'&&a.submittedOn<=i.due&&(+a.amount||0)>=owed(i)-0.001);
const owedSum=a=>r2(a.reduce((s,x)=>s+owed(x),0));
const adminBlocked=()=>!!S.user.accountBlocked;
const baseAvailable=()=>!creditApproved()||blocked()||adminBlocked()?0:Math.max(0,r2(Math.min(level().limit,approvedLimit())-usedLine()));
/* Burbujita puede dejar un único bono de $10 listo para la próxima solicitud cuando la línea aprobada está agotada. */
const available=()=>!creditApproved()||blocked()||adminBlocked()?0:r2(baseAvailable()+Math.max(0,Number(S.user.petBonusCredit)||0));
const cuotaOpts=L=>Array.from({length:L.maxN},(_,k)=>k+1);
/* Pipo: máximo 3 usos por mes calendario (cada uso cuesta 2 días de racha) */
let PIPO_MAX=3;
const monthKey=()=>today().slice(0,7);
const pipoUsed=()=>{const p=S.user.pipo;return p&&p.m===monthKey()?(Number(p.c)||0):0};
const pipoLeft=()=>Math.max(0,PIPO_MAX-pipoUsed());
const pctOf=n=>GS.rates&&GS.rates[n]!=null?Number(GS.rates[n]):S.config.rates[n]!=null?S.config.rates[n]:(DEFAULT_RATES[n]||0);
const quote=(amount,n)=>{
  const pct=pctOf(n), total=r2(amount*(1+pct/100)), c=r2(total/n);
  const list=[];for(let k=1;k<=n;k++)list.push({n:k,due:addDays(today(),GAP_DAYS*k),amount:k===n?r2(total-c*(n-1)):c});

/* Todos los pagos validados: abonos y cuotas completas, del más reciente al más antiguo */
function payments(){
  const out=[];
  S.loans.forEach(l=>{
    if(l.status!=='activo'&&l.status!=='pagado')return;
    (l.installments||[]).forEach(i=>{
      const ab=(i.abonos||[]).filter(a=>a.status==='paid');
      ab.forEach(a=>out.push({date:a.paidOn||a.submittedOn||i.due,sent:a.submittedOn||'',loan:l,i,kind:'Abono',amount:r2(+a.amount||0),ref:a.ref||'',method:method(l.method).name}));
      /* una cuota pagada por abonos ya aparece en sus abonos; solo se agrega aparte si se pagó con un envío completo */
      if(i.status==='paid'&&(i.ref||!ab.length))out.push({date:i.paidOn||i.due,sent:i.submittedOn||'',loan:l,i,kind:i.bundle?'Cancelación total':'Cuota',amount:r2(i.paymentAmount!=null?+i.paymentAmount:(+i.amount||0)+(+i.mora||0)),ref:i.ref||'',method:method(i.payMethod||l.method).name});

/* CSV: separador ';', decimales con coma, BOM para Excel, y se neutralizan celdas que empiezan con = + - @ (inyección de fórmulas) */
function csvCell(v){
  if(v==null)return '';
  if(typeof v==='number')return String(r2(v)).replace('.',',');
  let s=String(v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
const toCsv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
function download(name,text,type){
  try{
    const b=new Blob([text],{type:type||'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
    toast('Descargando '+name);
  }catch(e){toast('Este navegador no permitió la descarga.')}
}

/* ============ desembolso (comprobante que sube el prestamista), datos de pago móvil guardados y seguridad de imágenes ============ */
/* Solo se aceptan imágenes en data URL o enlaces del propio servidor / https: evita inyectar código a través de un "comprobante" manipulado */
const safeSrc=u=>/^(data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+|https?:\/\/[^\s"'<>]+|\/uploads\/[0-9a-f]{32}\.(?:jpg|png|webp)|sb:[0-9a-f-]{36}\/[A-Za-z0-9._-]+)$/.test(String(u||''))?String(u):'';
/* Las imágenes guardadas en el backend se leen con un token Bearer. Nunca se dejan accesibles como archivos públicos. */
async function hydratePrivateImages(root=document){
  if(!Backend.on||!Backend.tok()||!root||!root.querySelectorAll)return;
  /* Supabase Storage (bucket privado): se pide un enlace firmado que caduca en una hora. */
  for(const img of root.querySelectorAll('img[src^="sb:"]:not([data-private-image])')){
    const ref=img.getAttribute('src')||'';img.dataset.privateImage='loading';img.removeAttribute('src');
    try{img.src=await Backend.signedUrl(ref);img.dataset.privateImage='loaded'}
    catch(_){img.dataset.privateImage='error';img.alt='Imagen protegida: vuelve a iniciar sesión para verla.'}
  }
  for(const img of root.querySelectorAll('img[src*="/uploads/"]:not([data-private-image])')){
    const raw=img.getAttribute('src')||'';
    let u;try{u=new URL(raw,Backend.base()||location.href)}catch(_){continue}
    const m=u.pathname.match(/\/uploads\/([a-f0-9]{32}\.(?:jpg|png|webp))/i);if(!m)continue;
    img.dataset.privateImage='loading';
    try{
      const endpoint=new URL('/api/uploads/'+m[1],Backend.base()||u.origin).toString();
      const r=await fetch(endpoint,{headers:{Authorization:'Bearer '+Backend.tok()},cache:'no-store'});
      if(!r.ok)throw new Error('forbidden');
      const blob=await r.blob();img.src=URL.createObjectURL(blob);img.dataset.privateImage='loaded';
    }catch(_){img.dataset.privateImage='error';img.removeAttribute('src');img.alt='Imagen protegida: vuelve a iniciar sesión para verla.'}
  }
}

const digitsOf=s=>String(s||'').replace(/\D/g,'');
const samePm=(a,b)=>!!a&&!!b&&String(a.bank||'').trim().toLowerCase()===String(b.bank||'').trim().toLowerCase()&&digitsOf(a.phone)===digitsOf(b.phone)&&digitsOf(a.ci)===digitsOf(b.ci);
function savedPms(){
  const out=[];

    if(p&&p.bank&&p.phone&&p.ci&&!out.some(q=>samePm(q,p)))out.push({bank:p.bank,phone:p.phone,ci:p.ci});

  r.onload=()=>{
    let o=null;try{o=JSON.parse(r.result)}catch(x){}
    if(!validBackup(o)){toast('Ese archivo no es un respaldo válido de Quincena.');return}
    ui.importData=o;ui.sheet={type:'importConfirm'};renderSheet();
  };
  r.readAsText(f);
});
ui.enter=true;
render();
renderSheet();
Backend.connect().then(afterConnect);
/* La app se instala en el móvil y funciona sin conexión: los datos se sincronizan al volver la red. */
try{if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}}catch(e){}
</script>
